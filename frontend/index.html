<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CraftyChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,420;0,9..144,560;0,9..144,650;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎭</text></svg>" />
</head>
<body>
  <div class="app-container">
    <!-- Верхняя панель -->
    <header id="top-bar">
      <div class="logo">
        <span class="logo-mark">🎭</span>
        <span class="logo-text">CraftyChat<em>[System]</em></span>
      </div>
      <nav>
  <button class="menu-btn" data-menu="presets" title="Промпты и мини-пресеты, из которых собирается системный промпт">
    <img src="assets/icons/preset.svg" alt="Пресеты" width="22" height="22">
  </button>
  <button class="menu-btn" data-menu="background" title="Фоновое изображение приложения">
    <img src="assets/icons/background.svg" alt="Фоны" width="22" height="22">
  </button>
  <button class="menu-btn" data-menu="lore" title="Миры и записи, которые подключаются в промпт по ключевым словам">
    <img src="assets/icons/lore.svg" alt="Лорбуки" width="22" height="22">
  </button>
  <button class="menu-btn" data-menu="summary" title="Долгосрочная память чата — краткий пересказ старых сообщений">
    <img src="assets/icons/summary.svg" alt="Саммари" width="22" height="22">
  </button>
  <button class="menu-btn" data-menu="personas" title="Ваши игровые образы (User)">
    <img src="assets/icons/persona.svg" alt="Персоны" width="22" height="22">
  </button>
  <button class="menu-btn" data-menu="characters" title="AI-персонажи (Bot), с которыми вы общаетесь">
    <img src="assets/icons/characters.svg" alt="Персонажи" width="22" height="22">
  </button>
</nav>
    </header>

    <!-- Основная область -->
    <main id="app">
      <div id="main-content">
        <!-- сюда рендерится главная страница или чат -->
      </div>
    </main>

    <!-- Боковая панель Пресетов (слева) -->
    <aside id="presets-panel" class="side-panel left-panel">
      <div class="panel-header">
        <h2>⚙️ Пресеты</h2>
        <button class="close-panel" data-panel="presets">✕</button>
      </div>
      <div class="panel-body" id="presets-body"></div>
    </aside>

    <!-- Боковая панель Персонажей (справа) -->
    <aside id="characters-panel" class="side-panel right-panel">
      <div class="panel-header">
        <h2>🤖 Персонажи</h2>
        <button class="close-panel" data-panel="characters">✕</button>
      </div>
      <div class="panel-body" id="characters-body"></div>
    </aside>

    <!-- Центральная панель (для всех остальных) -->
    <div id="central-panel" class="central-panel">
      <div class="panel-header">
        <h2 id="central-panel-title">Заголовок</h2>
        <button class="close-panel" data-panel="central">✕</button>
      </div>
      <div class="panel-body" id="central-panel-body"></div>
    </div>

    <!-- Модальное окно для списка чатов -->
    <div id="chats-modal" class="modal-overlay" style="display:none;">
      <div class="modal-content">
        <div class="modal-header">
          <h2>📋 История чатов</h2>
          <button class="close-modal" id="closeChatsModal">✕</button>
        </div>
        <div class="modal-body" id="chats-modal-body"></div>
      </div>
    </div>
  </div>

  <script src="js/dataManager.js"></script>
  <script type="module" src="js/icons.js"></script>
  <script src="js/app.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/lorebooks.js"></script>
  <script src="js/personas.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/background.js"></script>
  <script src="js/summary.js"></script>
</body>
</html>
